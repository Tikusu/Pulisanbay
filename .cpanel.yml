---
deployment:
  tasks:
    # Destination path
    - export DEPLOYPATH=/home/drvkbfjp/public_html

    # Main project folders
    - /bin/cp -R public $DEPLOYPATH/
    - /bin/cp -R api $DEPLOYPATH/
    - /bin/cp -R config $DEPLOYPATH/
    - /bin/cp -R includes $DEPLOYPATH/

    # Root config files
    - /bin/cp .htaccess $DEPLOYPATH/
    - /bin/cp router.php $DEPLOYPATH/
    - /bin/cp package.json $DEPLOYPATH/
    - /bin/cp package-lock.json $DEPLOYPATH/
    - /bin/cp build.mjs $DEPLOYPATH/
